# electron-builder 打包配置。
# - 版本号由根目录 Makefile 通过 -c.extraMetadata.version 传入；
# - 产物名中的平台和架构取自 Makefile 设置的环境变量 KANBAN_PLATFORM、KANBAN_ARCH，
#   文件名为 kanban-app_v<版本>_<系统>_<架构>.<扩展名>；
# - 签名使用标准环境变量：Windows 为 WIN_CSC_LINK、WIN_CSC_KEY_PASSWORD，没有时不签名；
#   macOS 为 CSC_LINK、CSC_KEY_PASSWORD 和公证用的 APPLE_API_KEY、APPLE_API_KEY_ID、APPLE_API_ISSUER，
#   没有证书时临时签名（macOS 包只在 macOS 上打包）。
appId: com.akvicor.kanban-app
productName: Kanban
directories:
  output: release
files:
  - dist/**/*
  - package.json
asar: true
publish: null
artifactName: kanban-app_v${version}_${env.KANBAN_PLATFORM}_${env.KANBAN_ARCH}.${ext}

# Electron 运行时开关：关闭以 Node 方式运行、NODE_OPTIONS 和 --inspect 参数，只从 asar 加载应用并校验其完整性，
# 避免他人借客户端的可执行文件运行任意脚本。
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

linux:
  target:
    - AppImage
    - deb
  icon: ../assets/icon.png
  category: Office
  executableName: kanban-app
  # 窗口的 WM_CLASS 与 .desktop 文件名一致，桌面环境才能把运行中的窗口与启动器图标关联。
  syncDesktopName: true
  maintainer: Akvicor
  synopsis: Kanban desktop client

# deb 依赖：electron-builder 默认列表，加上 Electron 运行时需要的 ALSA 库（Debian 13 起包名为 libasound2t64）。
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2

win:
  target: nsis
  icon: ../assets/icon.png

nsis:
  oneClick: true
  perMachine: false

mac:
  target: dmg
  icon: ../assets/icon.png
  category: public.app-category.productivity
