<!doctype html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"/>
  <title>Kanban</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<main class="card">
  <img class="logo" src="../icon.png" alt=""/>
  <h1 data-i18n="errorTitle"></h1>
  <p id="origin" class="origin"></p>
  <p id="reason" class="error" role="alert"></p>
  <div class="actions">
    <button type="button" id="change-server" class="secondary" data-i18n="changeServer"></button>
    <button type="button" id="retry" data-i18n="retry"></button>
  </div>
  <p id="version" class="version"></p>
</main>
<script src="error.js"></script>
</body>
</html>
