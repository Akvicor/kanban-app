name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/package.json

      # Yarn 启动器转交给仓库自带的 desktop/.yarn/releases 版本。
      - name: Enable Yarn
        run: corepack enable

      - name: Verify
        run: make verify
